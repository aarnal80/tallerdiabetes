<section class="slide congreso-plantilla" data-slide="ponente">
<style>
#s-ponente {padding:85px 110px;color:var(--ink);overflow:hidden}
#s-ponente .kicker{color:var(--accent);margin:0 0 22px}
#s-ponente h1{font:700 90px/1.04 var(--serif);letter-spacing:-.025em}
#s-ponente h2{font:400 76px/1.08 var(--serif);letter-spacing:-.024em;margin:0 0 32px}
#s-ponente h3{font:700 43px/1.13 var(--serif)}
#s-ponente p,li{font:30px/1.42 var(--font)}
#s-ponente .lead{font-size:37px;line-height:1.36;margin:28px 0;color:var(--muted)}
#s-ponente a{color:var(--accent-ink);text-underline-offset:5px}
#s-ponente button{font:700 26px var(--font);cursor:pointer;color:var(--accent-ink)}
#s-ponente :is(a,button):focus-visible{outline:4px solid var(--accent);outline-offset:5px}
#s-ponente .split{display:grid;grid-template-columns:1.1fr .9fr;gap:80px;align-items:center}
#s-ponente .split h2{margin-bottom:0}
#s-ponente .portrait{width:520px;height:520px;object-fit:cover;border-radius:50%;border:4px solid var(--accent);padding:14px;justify-self:center}
#s-ponente .accent{color:var(--accent);font-weight:700;margin-top:34px}
#s-ponente figure{margin:0;text-align:center}
#s-ponente figure a{display:block}
#s-ponente figure img{display:block;margin:auto;max-width:100%;width:auto;height:auto;max-height:460px;object-fit:contain}
#s-ponente figure figcaption{font:25px/1.3 var(--font);color:var(--muted);margin-top:12px}
</style>
<div class="fill" id="s-ponente">
<p class="kicker plain">El ponente</p>
<div class="split"><div><h1>Dr. Antonio José<br>Arnal Meinhardt</h1><p class="lead">Medicina Familiar y Comunitaria<br>Medicina de Urgencias</p><p class="accent">Taller práctico con ChatGPT Plus</p></div><img class="portrait" src="assets/ponente.png" alt="Retrato del Dr. Antonio José Arnal Meinhardt"></div>
</div>
<div class="congreso-pie" aria-hidden="true"><img src="assets/congreso/pie.png" alt=""></div>
<aside hidden data-speaker-notes>00:00–00:20</aside>
</section>
